<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Framed login</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: #020617; color: #e2e8f0;
         font-family: Inter, system-ui, sans-serif; font-size: 13px; }
  p { margin: 0 0 10px; color: #94a3b8; font-size: 11px; }
  label { display: block; font-size: 11px; color: #94a3b8; margin: 8px 0 4px; }
  input { width: 100%; padding: 8px 10px; border-radius: 6px;
          border: 1px solid rgba(255,255,255,.12); background: #0f172a;
          color: #e2e8f0; font-size: 13px; font-family: inherit; }
  input:focus { outline: none; border-color: #2dd4bf; }
  code { background: rgba(255,255,255,.06); padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
  <p>Framed login form — origin <code id="origin"></code></p>
  <form onsubmit="return false">
    <label>Email</label>
    <input type="email" name="frame_email" autocomplete="username">
    <label>Password</label>
    <input type="password" name="frame_pw" autocomplete="current-password">
  </form>
  <script>document.getElementById('origin').textContent = window.location.origin;</script>
</body>
</html>
