<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XoraPass</title>
    <style>
      /* Declared here as well as in index.css so the very first paint matches —
         the stylesheet loads a moment later and a flash of the wrong background
         shows without it. */
      html, body {
        width: 380px;
        min-width: 380px;
        max-width: 380px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        color-scheme: light;
        background-color: #f8fafc;
        font-size: 15px;
      }
      html.dark, html.dark body {
        color-scheme: dark;
        background-color: #0a1412;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          background-color: #0a1412;
        }
        :root:not(.light) body {
          color-scheme: dark;
          background-color: #0a1412;
        }
      }
      #root {
        width: 380px;
        overflow: hidden;
      }
    </style>
    <script>
      try {
        if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
          chrome.storage.local.get(['themePreference'], function(res) {
            var pref = res && res.themePreference ? res.themePreference : 'system';
            var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            }
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/index.tsx"></script>
  </body>
</html>
