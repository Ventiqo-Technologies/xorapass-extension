<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XoraPass</title>
    <style>
      /* Declared here as well as in index.css so the very first paint matches —
         the stylesheet loads a moment later and a flash of the wrong background
         shows without it. */
      html {
        color-scheme: light;
        background-color: #f6f9f8;
      }
      /* Fix size of extension popup */
      body {
        width: 380px;
        height: 550px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f6f9f8; /* Cool teal-tinted canvas, matches web */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/index.tsx"></script>
  </body>
</html>
