<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XoraPass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Declared here as well as in index.css so the very first paint matches —
         the stylesheet loads a moment later and a flash of the wrong background
         shows without it. */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        width: 380px;
        min-width: 380px;
        max-width: 380px;
        height: 550px;
        min-height: 550px;
        max-height: 550px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        color-scheme: light;
        background-color: #f6f9f8; /* Cool teal-tinted canvas, matches web */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        width: 380px;
        height: 550px;
        min-height: 550px;
        max-height: 550px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/index.tsx"></script>
  </body>
</html>
