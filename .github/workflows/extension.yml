name: Extension — Build & Test

on:
  push:
    tags:
      - 'v*'
      - 'chrome-v*'
      - 'firefox-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target store to publish to'
        type: choice
        options:
          - all
          - chrome
          - firefox
        default: all
      publish:
        description: 'Publish to stores?'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Dependency Audit
        run: npm audit --audit-level=high
      - name: Run Vitest Unit Tests
        run: npm test
      - name: Build Extension
        run: npm run build

  release-firefox:
    name: Submit & Publish to Firefox Add-ons (AMO)
    needs: test-and-build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/firefox-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true && (inputs.target == 'all' || inputs.target == 'firefox'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Extension
        run: npm run build
      - name: Sign & Submit to Mozilla Add-ons (AMO)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --source-dir dist --channel listed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"

  release-chrome:
    name: Submit & Publish to Chrome Web Store
    needs: test-and-build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/chrome-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true && (inputs.target == 'all' || inputs.target == 'chrome'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Extension
        run: npm run build
      - name: Prepare Chrome zip package (strip key field)
        run: |
          sed -i '/key/d' dist/manifest.json
          cd dist && zip -r ../xorapass-extension-chrome.zip *
      - name: Upload & Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          file-path: xorapass-extension-chrome.zip
          publish: true
